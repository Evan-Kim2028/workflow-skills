<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent execution</title>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/plan.css">
<script>
try {
  var q = new URLSearchParams(location.search);
  var theme = q.get("theme") || localStorage.getItem("agent-dash-theme");
  if (theme === "dark" || theme === "light") document.documentElement.setAttribute("data-theme", theme);
} catch (e) {}
</script>
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 var(--font)}
.wrap{max-width:1400px;margin:0 auto;padding:18px 20px 40px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:20px;margin:0;font-weight:650}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.sp{flex:1}
button,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--ring);border-radius:6px;padding:5px 10px;cursor:pointer}
.tabs{display:flex;gap:2px;margin:14px 0 16px;border-bottom:1px solid var(--grid);overflow-x:auto}
.tab{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 12px;color:var(--ink-2);font-weight:600;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--s1)}
.tab .c{font:500 11px var(--mono);color:var(--muted);margin-left:6px}
.tab .tick{color:var(--good);font-weight:700;margin-left:6px}
.tab.muted{opacity:.6}
.tab.drop-before{box-shadow:inset 2px 0 0 var(--s1)}
.tab.drop-after{box-shadow:inset -2px 0 0 var(--s1)}
.tabfilter{margin-left:auto;display:inline-flex;align-items:center;gap:2px;padding-left:12px;align-self:center}
.tabfilter button{border:1px solid var(--ring);background:var(--surface);border-radius:6px;padding:4px 9px;font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tabfilter button[aria-pressed="true"]{color:var(--ink);border-color:var(--s1);box-shadow:inset 0 0 0 1px var(--s1)}
.tabfilter button.tabreset{border-color:transparent;color:var(--muted);font-weight:500}
.tabs-empty{align-self:center;color:var(--muted);font-size:12.5px;padding:8px 12px;white-space:nowrap}
.grid{display:grid;gap:14px}
.g-tiles{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr))}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:10px;padding:14px 16px;min-width:0}
.card h2{font-size:13.5px;margin:0 0 2px;font-weight:650}
.card .sub{font-size:12.5px;color:var(--ink-2);margin:0 0 10px}
.tile .v{font-size:28px;font-weight:650;line-height:1.1}
.tile .l{font-size:12.5px;color:var(--ink-2)}
.tile .x{font:12px var(--mono);color:var(--muted);margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2);margin:0 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .ltotal{color:var(--ink);padding-right:10px;border-right:1px solid var(--grid);font-variant-numeric:tabular-nums}
.legend .ltotal b{font-weight:700}
.mlegend{gap:6px 18px}
.mlegend .mfam{display:inline-flex;align-items:center;gap:4px 10px;flex-wrap:wrap;padding:2px 8px 2px 0;border-right:1px solid var(--grid)}
.mlegend .mfam:last-child{border-right:0}
.mlegend .mfam b{font-weight:700;color:var(--ink);margin-right:2px}
.tier .mfam-n{color:var(--muted);font-size:11px;margin-left:2px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
svg{display:block;overflow:visible}
.ax text,.ax{fill:var(--muted);font:11px var(--font)}
.gl{stroke:var(--grid);stroke-width:1}
.bl{stroke:var(--axis);stroke-width:1}
.plinks{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0 10px}
.plinks b{font:600 11.5px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-right:4px}
.plinks a{font:600 13px var(--font);color:var(--ink);text-decoration:none;padding:5px 11px;border-radius:999px;border:1px solid var(--grid);background:var(--surface)}
.plinks a:hover,.plinks a:focus-visible{border-color:var(--s1);color:var(--s1)}
.plinks a.cur{border-color:var(--s1);box-shadow:inset 0 0 0 1px var(--s1)}
.planbtn{margin-left:auto;font:600 13px var(--font);color:var(--s1);text-decoration:none;border:1px solid var(--s1);border-radius:999px;padding:4px 11px;white-space:nowrap}
.axt{fill:var(--ink-2);font:600 11px var(--font)}
.tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--ring);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:20;min-width:140px;display:none}
.tip b{display:block;margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
.tip .r i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--grid);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:middle}
td.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--surface-2)}
.tier{display:inline-flex;align-items:center;gap:6px;font:600 11.5px var(--mono)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%}
.st.running i{background:var(--s1);animation:pulse 1.4s infinite}
.st.done i{background:var(--good)}.st.killed i,.st.died_early i{background:var(--critical)}.st.queued i{background:var(--warning)}.st.finished i,.st.unknown i{background:var(--muted)}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.st.running i{animation:none}}
.vd{font:600 11px var(--mono);padding:2px 6px;border-radius:4px;background:var(--surface-2);color:var(--ink-2)}
.grow{color:var(--good-ink);font-size:11px;margin-left:4px}
.lbl{font-family:var(--mono);font-size:12.5px}
.ws{font:600 11.5px var(--mono);color:var(--ink-2)}
.meter{display:grid;grid-template-columns:70px minmax(0,1fr) 54px;gap:10px;align-items:center;margin:7px 0;font-size:12.5px}
.meter .trk{position:relative;height:14px;background:var(--surface-2);border-radius:3px}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.meter .cap{position:absolute;top:-3px;bottom:-3px;border-left:2px dashed var(--ink)}
.meter .n{text-align:right;font:12px var(--mono)}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.wsc{cursor:pointer}.wsc:hover{border-color:var(--s1)}
.wsc .top{display:flex;justify-content:space-between;align-items:baseline}
.wsc .id{font:700 15px var(--mono)}
.wsc .bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-2);margin:8px 0 4px;gap:2px}
.wsc .bar span{display:block;height:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--ring);box-shadow:-8px 0 30px rgba(0,0,0,.15);padding:18px;transform:translateX(105%);transition:transform .18s;z-index:30;overflow:auto}
.drawer.open{transform:none}
.seg-ctl{display:inline-flex;border:1px solid var(--ring);border-radius:6px;overflow:hidden}
.seg-ctl button{border:0;border-radius:0;padding:4px 10px;font-size:12px}
.seg-ctl button[aria-pressed="true"]{background:var(--surface-2);font-weight:650}
/* plan DAG */
.dag-scroll{overflow-x:auto;border:1px solid var(--ring);border-radius:10px;background:var(--surface-2)}
.dag{position:relative;min-width:1000px;display:grid;grid-template-columns:repeat(5,1fr);gap:30px;padding:14px}
.dcol{display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.dcolh{font-size:12px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
.dnode{background:var(--surface);border:1.5px solid var(--ring);border-radius:10px;padding:8px 10px}
.dnode.s-done{border-color:var(--good)}.dnode.s-prog{border-color:var(--s5)}.dnode.s-live{border-color:var(--s1);box-shadow:0 0 0 2px color-mix(in srgb,var(--s1) 25%,transparent)}
.dnode h4{margin:0 0 2px;font-size:13px}
.dnode .m{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.dnode .mini{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--grid);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:11px var(--mono);padding:2px 6px;border-radius:5px;border:1.5px solid var(--grid);color:var(--muted);border-style:dashed;display:inline-flex;align-items:center;gap:3px}
.chip::before{font-size:10px;line-height:1}
.chip.done{border-style:solid;border-color:var(--good);color:var(--good-ink);background:color-mix(in srgb,var(--good) 14%,transparent)}
.chip.done::before{content:"\2713"}
.chip.pr{border-style:solid;border-color:var(--warning);color:var(--ink);background:color-mix(in srgb,var(--warning) 22%,transparent)}
.chip.pr::before{content:"\29D7"}
.chip.prog{border-style:solid;border-color:var(--s5);color:var(--ink);background:color-mix(in srgb,var(--s5) 20%,transparent)}
.chip.prog::before{content:"\21E1"}
.chip.wip{border-style:solid;border-color:var(--s1);color:var(--ink);background:transparent}
.chip.wip::before{content:"\25D4"}
.chip.deferred{border-style:dotted;opacity:.6}
.chip.deferred::before{content:"\21B7"}
.chip.gate{border-style:dashed}
.chip.gate::before{content:"\25C7"}
.chip.gate.done::before{content:"\2713"}
.chip .att{font:600 9.5px var(--mono);color:var(--muted);margin-left:3px;padding:0 3px;border-radius:4px;border:1px solid var(--grid)}
.chip .att.hot{color:var(--ink);border-color:var(--warning)}
.chip.live{border-style:solid;border-color:var(--s1);background:var(--s1);color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--s1) 30%,transparent);animation:pulse 1.6s infinite}
.chip.live::before{content:"\25CF"}
.chip .ag{display:inline-block;min-width:14px;height:14px;line-height:14px;text-align:center;border-radius:7px;font:700 10px var(--mono);color:#fff;margin-left:2px;padding:0 3px;box-shadow:0 0 0 1.5px #fff}
.chip.just{outline:2.5px solid var(--good);outline-offset:1px}
.dnode .live-n{font:600 11.5px var(--mono);color:var(--s1);margin-bottom:4px}
.unassigned{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.unassigned span{font:12px var(--mono);border:1.5px solid var(--ring);border-radius:5px;padding:2px 6px}
.plegend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:0 0 10px;font-size:12px;color:var(--ink-2)}
.plegend .chip{pointer-events:none}
@media (prefers-reduced-motion:reduce){.chip.live{animation:none}}
.dedges{position:absolute;inset:0;pointer-events:none;z-index:0}
.dedges path{fill:none;stroke:var(--muted);stroke-width:1.4;opacity:.6}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:12px}
.phase{border-left:3px solid var(--s1);padding:2px 0 2px 10px;font-size:12.5px}
.phase b{display:block;font-size:13px}
.phase small{color:var(--muted)}
.phase{cursor:default}
.phase small.gate{display:block;margin-top:4px;cursor:help}
.foot{margin-top:22px;font-size:12px;color:var(--muted)}
[hidden]{display:none !important}
.view-toggle{display:inline-flex;border:1px solid var(--ring);border-radius:6px;overflow:hidden}
.view-toggle button{border:0;border-radius:0;background:transparent;color:var(--ink-2);font-weight:600;padding:6px 12px}
.view-toggle button[aria-pressed="true"]{background:var(--s1);color:#fff}
.needs-you{margin-bottom:14px}
.needs-line{margin:4px 0;font-size:13px;color:var(--ink-2)}
.needs-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--grid);font-size:13.5px}
.needs-row a{color:var(--ink);font-weight:650;text-decoration:none}
.needs-row a:hover,.needs-row a:focus-visible{color:var(--s1)}
.ap-badge{display:inline-block;font:600 11px var(--mono);padding:2px 7px;border-radius:999px;border:1px solid var(--grid);white-space:nowrap}
.ap-badge.oneway{color:var(--critical);border-color:var(--critical);background:color-mix(in srgb,var(--critical) 12%,transparent)}
.ap-badge.rev{color:var(--good-ink);border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.ap-group{margin-top:12px}
.ap-group h3{font-size:13px;margin:0 0 4px}
.ap-row{display:grid;grid-template-columns:minmax(0,1.4fr) auto minmax(0,1fr);gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--grid);font-size:14px}
.ap-cond{color:var(--ink-2);font-size:13px}
.ap-step{min-width:0}
@media (max-width:640px){.ap-row{grid-template-columns:minmax(0,1fr)}}

/* plan map: where you are, at a glance */
.pbig{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:4px 12px;align-items:center;margin:2px 0 12px}
.pbig-pct{grid-row:1/3;font:700 28px/1 var(--font);font-variant-numeric:tabular-nums;min-width:64px}
.pbig-bar{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden;background:var(--grid)}
.pbig-bar span{display:block;height:100%;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.pbig-txt{font:12px var(--mono);color:var(--ink-2)}
.colbar{height:4px;border-radius:2px;background:var(--grid);overflow:hidden;margin:-4px 0 2px}
.colbar i{display:block;height:100%;background:var(--good);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.dcol.c-now .dcolh{color:var(--s1)}
.dnode{transition:opacity .3s,box-shadow .3s,border-color .3s}
.dnode.g-done{opacity:.62}
.dnode.g-done:hover{opacity:1}
.dnode.g-done h4::after{content:" \2713";color:var(--good)}
.dnode.g-now{border-color:var(--s1);box-shadow:0 0 0 3px color-mix(in srgb,var(--s1) 22%,transparent),0 6px 18px -8px color-mix(in srgb,var(--s1) 60%,transparent);animation:glow 2.4s ease-in-out infinite}
.dnode.g-ready{border-style:dashed;border-color:var(--ink-2)}
.gtag{float:right;font:700 10px var(--mono);letter-spacing:.03em;padding:2px 6px;border-radius:999px;margin-left:6px}
.gtag.now{background:var(--s1);color:#fff}
.gtag.ready{border:1px dashed var(--ink-2);color:var(--ink-2)}
.gtag.done{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good-ink)}
.gtag.merge{background:color-mix(in srgb,var(--warning) 28%,transparent);color:var(--ink)}
.gtag.prod{background:color-mix(in srgb,var(--s5) 26%,transparent);color:var(--ink)}
.gtag.wait{color:var(--muted);border:1px solid var(--grid)}
.gtag{cursor:help}
.dnode .m b{color:var(--ink);font-weight:700}
.pbig-txt b{color:var(--ink)}
.legend-tip{position:relative;font:600 12px var(--font);color:var(--ink-2);border:1px solid var(--grid);border-radius:999px;padding:3px 10px;cursor:help;outline:none}
.legend-tip .pop{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:20;width:min(560px,86vw);background:var(--surface);border:1px solid var(--ring);border-radius:10px;padding:12px 14px;box-shadow:0 10px 30px -12px rgba(0,0,0,.35);font-weight:400;cursor:default}
.legend-tip:hover .pop,.legend-tip:focus-within .pop{display:block}
.legend-tip .pop b{display:block;margin-bottom:8px;color:var(--ink)}
.legend-tip .pop p{margin:8px 0 0;font-size:12px;line-height:1.45;color:var(--ink-2)}
@keyframes glow{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--s1) 14%,transparent),0 6px 22px -8px color-mix(in srgb,var(--s1) 70%,transparent)}}
.dedges path.done{stroke:var(--good);opacity:.75}
.dedges path.flow{stroke:var(--s1);opacity:.95;stroke-width:1.8;stroke-dasharray:6 6;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
.chip{transition:background-color .4s,border-color .4s,color .4s}
.chip.changed{animation:flash 1.4s ease-out 1}
@keyframes flash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 70%,transparent);transform:scale(1.12)}100%{box-shadow:0 0 0 10px transparent;transform:scale(1)}}
.chip.live{animation:livering 1.8s ease-out infinite}
@keyframes livering{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--s1) 55%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
@media (prefers-reduced-motion: reduce){.dnode.g-now,.dedges path.flow,.chip.changed,.chip.live{animation:none}.pbig-bar span,.colbar i{transition:none}}

/* polish: motion and feel (all switched off under prefers-reduced-motion) */
header{position:sticky;top:0;z-index:30;padding:10px 0;margin:-10px 0 0;background:color-mix(in srgb,var(--bg, var(--surface)) 84%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
button,select,.tab,.seg-ctl button,.card,.chip,tr.clk td{transition:background-color .16s ease,border-color .16s ease,color .16s ease,box-shadow .2s ease}
button:hover{border-color:var(--ink-2)}
button:focus-visible,.tab:focus-visible,a:focus-visible,tr.clk:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.tab:hover{color:var(--ink)}
.card:hover{border-color:color-mix(in srgb,var(--ink-2) 35%,var(--ring))}
.tip{animation:tipin .14s ease-out}
@keyframes tipin{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.drawer{transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.tile .v,.pbig-pct{font-variant-numeric:tabular-nums}
@keyframes viewin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.empty{display:flex;align-items:center;gap:8px;padding:14px 4px;color:var(--muted)}
.empty::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--grid);flex:none}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--grid) 0%,var(--surface-2) 50%,var(--grid) 100%);background-size:200% 100%;animation:skel 1.2s linear infinite;margin:8px 0}
@keyframes skel{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

.ctx-est{color:var(--muted)}
.cached{color:var(--muted);font-size:11px}
.copybtn{margin-left:auto;font:600 12.5px var(--font);border-radius:999px;padding:4px 11px}
.copybtn+.planbtn{margin-left:8px}
.copybtn.ok{border-color:var(--good);color:var(--good-ink, var(--good))}
.copy-modal{position:fixed;inset:20% 20% auto;z-index:60;background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.4);display:grid;gap:10px}
.copy-modal textarea{width:100%;min-height:200px;font:12px var(--mono);background:var(--surface-2);color:var(--ink);border:1px solid var(--ring);border-radius:8px;padding:8px}

.program{border-color:color-mix(in srgb,var(--s1) 35%,var(--ring))}
.prog-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.prog-h h2{margin:0}.prog-h .sub{margin:0}
.prog-total{font:600 13px var(--mono);color:var(--ink-2);margin:6px 0 10px}
.prog-row{display:grid;grid-template-columns:minmax(150px,220px) 108px minmax(160px,1fr) 52px minmax(150px,auto) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--grid)}
.prog-name b{font:700 14px var(--mono);margin-right:8px}.prog-name span{color:var(--ink-2);font-size:13px}
.prog-pill{justify-self:start;font:700 11px var(--mono);padding:3px 9px;border-radius:999px;border:1px solid var(--grid);color:var(--ink-2)}
.prog-pill.done{background:color-mix(in srgb,var(--good) 18%,transparent);border-color:var(--good);color:var(--good-ink, var(--good))}
.prog-pill.active{background:color-mix(in srgb,var(--s1) 16%,transparent);border-color:var(--s1);color:var(--ink)}
.prog-bar{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden;background:var(--grid)}
.prog-bar span{display:block;height:100%;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.prog-pct{font:700 18px var(--font);font-variant-numeric:tabular-nums;text-align:right}
.prog-meta{font:12px var(--mono);color:var(--muted)}
.prog-acts{display:flex;gap:6px;justify-content:flex-end}.prog-acts button{font-size:12.5px;padding:4px 10px;border-radius:999px}.prog-acts .copybtn{margin-left:0}
.prog-row.s-done{opacity:.85}
@media (max-width:1000px){.prog-row{grid-template-columns:1fr auto;}.prog-bar,.prog-meta,.prog-acts{grid-column:1/-1}}

.working-now{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 10px}
.working-now>b{font:700 12px var(--mono);color:var(--s1);margin-right:4px}
.wn-pill{display:inline-flex;align-items:center;gap:6px;font:12px var(--mono);padding:3px 10px 3px 6px;border-radius:999px;border:1px solid color-mix(in srgb,var(--s1) 45%,var(--ring));background:color-mix(in srgb,var(--s1) 10%,var(--surface))}
.wn-pill i{width:8px;height:8px;border-radius:50%;animation:livering 1.8s ease-out infinite}
.wn-pill .wn-id{font-weight:700;color:var(--ink)}.wn-pill .wn-slug{color:var(--ink-2)}.wn-pill .wn-tok{color:var(--muted);font-size:11px}

/* floating top bar: title, view toggle, range, theme and the workstream tabs stay visible while scrolling */
.topbar{position:sticky;top:0;z-index:35;margin:-18px -20px 14px;padding:10px 20px 0;background:color-mix(in srgb,var(--page) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--grid)}
.topbar header{position:static;margin:0;padding:0;background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.topbar .tabs{margin:8px 0 0;border-bottom:0}
[data-nav], [data-sec], .lay, #plan-body h2, #plan-body h3, #plan-body section { scroll-margin-top: 120px; }

/* plan map focus-on-hover */
.dag.focus .dnode{opacity:.32;transition:opacity .2s ease}
.dag.focus .dnode.f-self,.dag.focus .dnode.f-up,.dag.focus .dnode.f-down{opacity:1}
.dag.focus .dnode.f-self{box-shadow:0 0 0 3px color-mix(in srgb,var(--s1) 40%,transparent)}
.dag.focus .dnode.f-up{border-color:var(--warning)}
.dag.focus .dnode.f-down{border-color:var(--s1);border-style:dashed}
.dag.focus .dedges path{opacity:.12}
.dag.focus .dedges path.e-up{opacity:1;stroke:var(--warning);stroke-width:2;stroke-dasharray:6 6;animation:flow 1s linear infinite reverse}
.dag.focus .dedges path.e-down{opacity:1;stroke:var(--s1);stroke-width:2;stroke-dasharray:6 6;animation:flow 1s linear infinite}
@media (prefers-reduced-motion: reduce){.dag.focus .dedges path{animation:none}}
.tedges{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:visible}
.tedges path.tl{fill:none;stroke-width:1.3;stroke-dasharray:4 5;opacity:.55;animation:flow 1.1s linear infinite}
.tedges path.tl.near{stroke-width:2;opacity:1}
.dag.tfocus .chip.t-self,.dag.tfocus .chip.t-up,.dag.tfocus .chip.t-down{position:relative;z-index:4}
.tedges path.tl.t-up{stroke:var(--warning);animation-direction:reverse}
.tedges path.tl.t-down{stroke:var(--s1)}
.tedges .tm.t-up{fill:var(--warning)}
.tedges .tm.t-down{fill:var(--s1)}
.tedges path.tl{pointer-events:none}
.tedges path.tl.a-met{stroke:var(--good);stroke-width:1.2;stroke-dasharray:none;opacity:.5;animation:none}
.tedges path.tl.a-un{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:3 4;opacity:.45;animation:none}
.tedges .tm.a-met{fill:var(--good)}
.tedges .tm.a-un{fill:var(--muted)}
.tedges path.thit{fill:none;stroke:rgba(0,0,0,0);stroke-width:12;pointer-events:stroke}
.dag.tfocus .dedges path{opacity:.08}
.dag.tfocus .dnode{opacity:.35;transition:opacity .2s ease}
.dag.tfocus .dnode.t-lit{opacity:1}
.dag.tfocus .chip{opacity:.28;transition:opacity .15s ease}
.dag.tfocus .chip.t-self,.dag.tfocus .chip.t-up,.dag.tfocus .chip.t-down{opacity:1}
.dag.tfocus .chip.t-self{outline:2.5px solid var(--ink);outline-offset:2px}
.dag.tfocus .chip.t-up{box-shadow:0 0 0 2px var(--warning)}
.dag.tfocus .chip.t-down{box-shadow:0 0 0 2px var(--s1)}
.dag.tfocus .chip.t-near{font-weight:700}
@media (prefers-reduced-motion: reduce){.tedges path.tl{animation:none}}
/* merge trains on the progress map: a tag and a colored left edge per member chip, plus a legend under the map */
.chip.intrain{padding-left:5px}
.trtag{font:700 9.5px var(--mono);color:var(--ink-2);border:1px solid var(--grid);border-radius:4px;padding:0 3px;margin-left:2px;white-space:nowrap}
.trlegend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 0;font-size:12px;color:var(--ink-2)}
.trlegend span{display:inline-flex;align-items:center;gap:6px}
.alegend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 0;font-size:12px;color:var(--ink-2)}
.alegend span{display:inline-flex;align-items:center;gap:6px}
.alegend svg{overflow:visible}
.arrows-toggle{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--font);color:var(--ink-2);margin-left:8px}
.gchip{font:11px var(--mono);padding:2px 6px;border-radius:5px;border:1.5px dashed var(--muted);color:var(--ink-2)}
</style>

<body>
<div class="wrap">
<div class="topbar">
<header class="shell">
<h1 id="title">Agent dashboard</h1>
<span class="live"><span class="dot" id="live-dot"></span><span id="live-txt">connecting</span></span>
<nav class="view-toggle" aria-label="View">
<button type="button" id="view-plan" aria-pressed="false">Plan</button>
<button type="button" id="view-exec" aria-pressed="true">Execution</button>
</nav>
<button type="button" id="nav-sections" aria-expanded="false" aria-controls="sidenav" aria-keyshortcuts="[" title="Section list">Sections</button>
<span class="sp"></span>
<span class="seg-ctl" id="range"><button data-h="6" aria-pressed="false">6 h</button><button data-h="12" aria-pressed="true">12 h</button><button data-h="24" aria-pressed="false">24 h</button><button data-h="72" aria-pressed="false">3 d</button></span>

</header>
<nav class="tabs" id="tabs" role="tablist" aria-label="Workstreams"></nav>
</div>
<div id="exec-view">
<main id="main"></main>
<p class="foot" id="foot"></p>
</div>
<div id="plan-view" class="plan-view" hidden>
<main class="plan-main" id="plan-body"></main>
</div>
</div>
<div class="tip" id="tip"></div>
<aside class="drawer" id="drawer" aria-label="Run details"></aside>
<script src="/static/format.js"></script>
<script src="/static/tokencache.js"></script>
<script src="/static/tabs.js"></script>
<script src="/static/models.js"></script>
<script src="/static/vendor/mermaid.min.js"></script>
<script src="/static/plan.js"></script>
<script>
(function () {

        });
      }

        var sbase = "snapshot";
        if (params && params.ws && params.ws !== "all") sbase = "snapshot-" + params.ws;

      if (path === "/api/plan") base = "plan-" + params.ws;

    }
    return fetch(path + (qs ? "?" + qs : "")).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }

  /* tooltip */
  var tip = document.getElementById("tip");
  function showTip(ev, title, rows) {
    tip.innerHTML = ""; tip.appendChild(el("b", {text: title}));
    rows.forEach(function (r) { var d = el("div", {class: "r"}); var a = el("span"); if (r.c) { var i = el("i"); i.style.background = r.c; a.appendChild(i); } a.appendChild(document.createTextNode(r.k)); d.appendChild(a); d.appendChild(el("span", {text: r.v})); tip.appendChild(d); });
    tip.style.display = "block";
    var x = ev.clientX + 14, y = ev.clientY + 14, w = tip.offsetWidth, h = tip.offsetHeight;
    if (x + w > innerWidth - 8) x = ev.clientX - w - 14; if (y + h > innerHeight - 8) y = ev.clientY - h - 14;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  function hideTip() { tip.style.display = "none"; }

  function canonWs(ws) {
    if (!ws || String(ws).toLowerCase() === "all" || String(ws).toLowerCase() === "overview") return "all";
    if (/^ws\d+$/i.test(ws)) return String(ws).toUpperCase();
    return String(ws);
  }
  function readRoute() {
    var q = new URLSearchParams(location.search);
    var view = q.get("view");
    var path = location.pathname;
    if (view !== "plan" && view !== "exec") view = (path === "/plan" || /plan\.html$/.test(path)) ? "plan" : "exec";
    return {view: view, ws: canonWs(q.get("ws") || "")};
  }
  function planIdFor(ws) {
    if (ws && ws !== "all") return ws;
    var program = null;
    (state.bundles || []).forEach(function (b) { if (!program && (b.kind === "program" || b.id === "OVERVIEW")) program = b; });
    if (program) return program.id;
    return (state.bundles && state.bundles.length) ? state.bundles[0].id : "OVERVIEW";
  }
  function queryWs() {
    if (state.view === "plan") return planIdFor(state.ws);
    return state.ws === "all" ? "all" : state.ws;
  }
  function pushRoute(hash) {

    u.searchParams.set("ws", queryWs());

  function groupFor() { return state.ws === "all" ? state.groupBy : "model"; }

  }
  function showCurrent() {
    applyChrome();
    renderTabs();
    if (state.view === "exec") {
      var hit = getCache();
      if (hit) {
        applyHit(hit);
        drawMain();
      } else {
        showLoading();
      }
      refreshAll();
      return;
    }
    var id = planIdFor(state.ws);
    var job = window.PlanView ? PlanView.show(id) : null;
    if (job && job.then) job.then(function (ok) { setLive(ok !== false); scrollHash(); });
  }
  function selectTab(ws) {

  function selectView(view) {

    showCurrent();
  }
  function openPlan(ws) {

  function openApprovals(ws) {

  function tabRows() {

  /* Tab filter (All | Active | Completed) and drag order, remembered per

    if (btn) btn.focus();
  }
  function filterCtl(counts) {
    var wrap = el("span", {class: "tabfilter", role: "group", "aria-label": "Filter workstream tabs"});
    [["all", "All"], ["active", "Active"], ["completed", "Completed"]].forEach(function (m) {
      var b = el("button", {type: "button", "aria-pressed": String(tabFilter === m[0]), title: "Show " + m[0] + " workstream tabs", onclick: function () { tabFilter = m[0]; ADT.saveMode(m[0]); renderTabs(); }}, [m[1] + " " + fmtN(counts[m[0]])]);

    state.view = next.view;
    state.ws = next.ws;
    showCurrent();
  });

  window.DashCache = {snap: {}, bundle: {}};
  window.DashNav = {openExec: function (ws) { state.ws = canonWs(ws); state.view = "exec"; pushRoute(); showCurrent(); }, openPlan: openPlan};
  var start = readRoute();
  state.view = start.view;
  state.ws = start.ws;
  if (window.PlanView) PlanView.configure({fixtures: FIX, taskmapGet: function () { return TASKMAP; }});
  applyChrome();
  renderTabs();
  loadTaskmap().then(loadNav).then(function () { showCurrent(); });
  stream();
  setInterval(function () {
    loadTaskmap().then(function () {
      if (state.view === "exec") refreshAll();
      else { loadNav(); if (window.PlanView) PlanView.refresh(); }
    });
  }, 30000);
})();
</script>
<script src="/static/sidenav.js"></script>
</body>
