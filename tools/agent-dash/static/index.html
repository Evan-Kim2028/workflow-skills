<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent execution</title>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/plan.css">
<link rel="stylesheet" href="/static/cards/plan-progress.css">
<link rel="stylesheet" href="/static/cards/tiles.css">
<link rel="stylesheet" href="/static/cards/timeline.css">
<link rel="stylesheet" href="/static/cards/token-chart.css">
<link rel="stylesheet" href="/static/cards/live-chart.css">
<link rel="stylesheet" href="/static/cards/ws-cards.css">
<link rel="stylesheet" href="/static/cards/tables.css">
<link rel="stylesheet" href="/static/cards/project-home.css">
<link rel="stylesheet" href="/static/cards/planned.css">
<link rel="stylesheet" href="/static/cards/archive.css">
<link rel="stylesheet" href="/static/cards/feed.css">
<link rel="stylesheet" href="/static/cards/decisions.css">
<link rel="stylesheet" href="/static/cards/depgraph.css">
<link rel="stylesheet" href="/static/cards/roadmap.css">
<link rel="stylesheet" href="/static/cards/burnup.css">
<script src="/static/core/theme.js"></script>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(1100px 320px at 18% -80px,rgba(76,150,255,.10),transparent 60%),radial-gradient(900px 300px at 85% -60px,rgba(240,117,168,.06),transparent 60%)}
::selection{background:var(--accent-soft)}
*{scrollbar-width:thin;scrollbar-color:var(--axis) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--axis);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
a{color:var(--accent);text-decoration-thickness:from-font}
a:hover{text-decoration:underline}
.wrap{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:18px var(--gutter) 40px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:var(--fs-h1);margin:0;font-weight:750;letter-spacing:-.01em}
.proj-sub{font-weight:400;color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:7px;font:600 12px var(--mono);color:var(--ink-2);border:1px solid var(--ring);border-radius:var(--r-pill);padding:4px 11px 4px 8px;background:var(--surface)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--good);box-shadow:0 0 0 3px var(--good-soft);animation:beat 2s var(--ease-out) infinite}
@keyframes beat{50%{box-shadow:0 0 0 6px transparent}}
.sp{flex:1}
button,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--ring);border-radius:var(--r-sm);padding:5px 10px;cursor:pointer}
#theme,#nav-sections{border-radius:var(--r-pill);padding:6px 13px;font-weight:600}
#theme:hover,#nav-sections:hover{border-color:var(--ring-strong)}
.tabs{display:flex;align-items:flex-end;gap:4px;margin:14px 0 16px;border-bottom:1px solid var(--grid);overflow-x:auto;scrollbar-width:none}
.tab{display:inline-flex;align-items:center;gap:7px;border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:9px 12px 11px;color:var(--ink-2);font-weight:650;font-size:13.5px;white-space:nowrap;cursor:grab;position:relative}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-2px;height:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 12px var(--accent-glow)}
.tab[draggable="true"]::before{content:"\22EE\22EE";color:var(--muted);font-size:11px;letter-spacing:1px}
.tab .c{font:600 11px var(--mono);color:var(--muted);background:var(--surface-2);border-radius:var(--r-pill);padding:1px 7px;margin-left:6px}
.tab .tick{color:var(--good);font-weight:800;margin-left:6px}
.tab.muted{opacity:.55}
.tab.dragging{opacity:.4}
.tab.drop-before{box-shadow:inset 2px 0 0 var(--accent)}
.tab.drop-after{box-shadow:inset -2px 0 0 var(--accent)}
.tabfilter{margin-left:auto;display:inline-flex;align-items:center;gap:4px;padding:0 0 6px 12px;align-self:flex-end;flex:none;position:sticky;right:0;background:color-mix(in srgb,var(--page) 88%,transparent)}
.tabfilter button{border:1px solid var(--ring);background:var(--surface);border-radius:var(--r-pill);padding:4px 11px;font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tabfilter button[aria-pressed="true"]{color:var(--accent-ink);background:var(--accent-fill,var(--accent));border-color:transparent}
.tabfilter button.tabreset{border-color:transparent;color:var(--muted);font-weight:500}
.tabs-empty{align-self:center;color:var(--muted);font-size:12.5px;padding:8px 12px;white-space:nowrap}
.grid{display:grid;gap:14px}
.g-tiles{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr))}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r-card);padding:18px 20px;min-width:0;box-shadow:var(--shadow-card);position:relative}
.card::before{content:"";position:absolute;top:0;left:var(--r-card);right:var(--r-card);height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.09),transparent);pointer-events:none}
.card:hover{border-color:var(--ring-strong)}
.card[aria-busy="true"]{min-height:120px}
.card h2{font-size:var(--fs-h2);margin:0 0 2px;font-weight:700}
.card .sub{font-size:var(--fs-sub);color:var(--ink-2);margin:0 0 12px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2);margin:0 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .ltotal{color:var(--ink);padding-right:10px;border-right:1px solid var(--grid);font-variant-numeric:tabular-nums}
.legend .ltotal b{font-weight:700}
.mlegend{gap:6px 18px}
.mlegend .mfam{display:inline-flex;align-items:center;gap:4px 10px;flex-wrap:wrap;padding:2px 8px 2px 0;border-right:1px solid var(--grid)}
.mlegend .mfam:last-child{border-right:0}
.mlegend .mfam b{font-weight:700;color:var(--ink);margin-right:2px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
svg{display:block;overflow:visible}
.ax text,.ax{fill:var(--muted);font:11px var(--font)}
.gl{stroke:var(--grid);stroke-width:1}
.bl{stroke:var(--axis);stroke-width:1}
.plinks{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0 10px}
.plinks b{font:600 11.5px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-right:4px}
.plinks a{font:600 13px var(--font);color:var(--ink);text-decoration:none;padding:5px 11px;border-radius:999px;border:1px solid var(--grid);background:var(--surface)}
.plinks a:hover,.plinks a:focus-visible{border-color:var(--s1);color:var(--s1)}
.plinks a.cur{border-color:var(--s1);box-shadow:inset 0 0 0 1px var(--s1)}
.planbtn{margin-left:auto;font:600 13px var(--font);color:var(--s1);text-decoration:none;border:1px solid var(--s1);border-radius:999px;padding:4px 11px;white-space:nowrap}
.axt{fill:var(--ink-2);font:600 11px var(--font)}
.tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--ring);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:20;min-width:140px;display:none}
.tip b{display:block;margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
.tip .r i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
@keyframes pulse{50%{opacity:.35}}
.meter{display:grid;grid-template-columns:70px minmax(0,1fr) 54px;gap:10px;align-items:center;margin:7px 0;font-size:12.5px}
.meter .trk{position:relative;height:14px;background:var(--surface-2);border-radius:3px}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.meter .cap{position:absolute;top:-3px;bottom:-3px;border-left:2px dashed var(--ink)}
.meter .n{text-align:right;font:12px var(--mono)}
.empty{display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed var(--ring-strong);border-radius:var(--r-card);padding:24px;text-align:center;color:var(--ink-2);font-size:13.5px}
.empty::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--grid);flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--ring);box-shadow:-8px 0 30px rgba(0,0,0,.15);padding:18px;transform:translateX(105%);transition:transform .18s;z-index:30;overflow:auto}
.drawer.open{transform:none}
.seg-ctl{display:inline-flex;border:1px solid var(--ring);border-radius:var(--r-pill);padding:3px;background:var(--surface);gap:2px}
.seg-ctl button{border:0;border-radius:var(--r-pill);background:transparent;color:var(--ink-2);padding:4px 10px;font-size:12px}
.seg-ctl button[aria-pressed="true"]{background:var(--accent-fill,var(--accent));color:var(--accent-ink);font-weight:650}
/* plan DAG: moved to static/cards/plan-progress.css */.foot{margin-top:22px;font-size:12px;color:var(--muted)}
[hidden]{display:none !important}
.view-toggle{display:inline-flex;border:1px solid var(--ring);border-radius:var(--r-pill);padding:3px;background:var(--surface);gap:2px}
.view-toggle button{border:0;border-radius:var(--r-pill);background:transparent;color:var(--ink-2);font-weight:650;font-size:13px;padding:5px 14px}
.view-toggle button[aria-pressed="true"]{background:var(--accent-fill,var(--accent));color:var(--accent-ink)}
.view-nav{display:inline-flex;border:1px solid var(--ring);border-radius:var(--r-pill);padding:3px;background:var(--surface);gap:2px}
.view-nav button{border:0;border-radius:var(--r-pill);background:transparent;color:var(--ink-2);font-weight:650;font-size:13px;padding:5px 14px;white-space:nowrap}
.view-nav button[aria-current="page"]{background:var(--accent-fill,var(--accent));color:var(--accent-ink)}
.needs-you{margin-bottom:14px}
.needs-line{margin:4px 0;font-size:13px;color:var(--ink-2)}
.needs-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--grid);font-size:13.5px}
.needs-row a{color:var(--ink);font-weight:650;text-decoration:none}
.needs-row a:hover,.needs-row a:focus-visible{color:var(--s1)}
.ap-badge{display:inline-block;font:600 11px var(--mono);padding:2px 7px;border-radius:999px;border:1px solid var(--grid);white-space:nowrap}
.ap-badge.oneway{color:var(--critical);border-color:var(--critical);background:color-mix(in srgb,var(--critical) 12%,transparent)}
.ap-badge.rev{color:var(--good-ink);border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.ap-group{margin-top:12px}
.ap-group h3{font-size:13px;margin:0 0 4px}
.ap-row{display:grid;grid-template-columns:minmax(0,1.4fr) auto minmax(0,1fr);gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--grid);font-size:14px}
.ap-cond{color:var(--ink-2);font-size:13px}
.ap-step{min-width:0}
@media (max-width:640px){.ap-row{grid-template-columns:minmax(0,1fr)}}
/* phone (390 px): 16 px gutters, no horizontal scroll. Tables and chart
   internals adapt in their own card CSS; the shell stacks, goes 2-up for
   tiles, and offers .hidephone for non-essential columns. */
@media (max-width:700px){
.wrap{padding:0 var(--gutter-phone) 40px}
.topbar{margin:0 calc(-1 * var(--gutter-phone));padding:10px var(--gutter-phone) 0}
.g-tiles{grid-template-columns:1fr 1fr}
.g-2{grid-template-columns:minmax(0,1fr)}
.card{padding:14px}
.hidephone{display:none!important}
}

/* plan map header and tiles: moved to static/cards/plan-progress.css */

/* polish: motion and feel (all switched off under prefers-reduced-motion) */
header{position:sticky;top:0;z-index:30;padding:10px 0;margin:-10px 0 0;background:color-mix(in srgb,var(--bg, var(--surface)) 84%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
button,select,.tab,.seg-ctl button,.card,.chip,tr.clk td{transition:background-color .16s ease,border-color .16s ease,color .16s ease,box-shadow .2s ease}
button:hover{border-color:var(--ink-2)}
button:focus-visible,.tab:focus-visible,a:focus-visible,tr.clk:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;box-shadow:0 0 0 4px var(--accent-soft)}
.tab:hover{color:var(--ink)}
.tip{animation:tipin .14s ease-out}
@keyframes tipin{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.drawer{transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.tile .v,.pbig-pct{font-variant-numeric:tabular-nums}
@keyframes viewin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--raised) 0%,var(--overlay) 50%,var(--raised) 100%);background-size:200% 100%;animation:skel 1.2s linear infinite;margin:8px 0}
@keyframes skel{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

.ctx-est{color:var(--muted)}
.cached{color:var(--muted);font-size:11px}
.copybtn{margin-left:auto;font:600 12.5px var(--font);border-radius:999px;padding:4px 11px}
.copybtn+.planbtn{margin-left:8px}
.copybtn.ok{border-color:var(--good);color:var(--good-ink, var(--good))}
.copy-modal{position:fixed;inset:20% 20% auto;z-index:60;background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.4);display:grid;gap:10px}
.copy-modal textarea{width:100%;min-height:200px;font:12px var(--mono);background:var(--surface-2);color:var(--ink);border:1px solid var(--ring);border-radius:8px;padding:8px}


/* working-now pills: moved to static/cards/plan-progress.css */

/* floating top bar: title, view toggle, theme and the workstream tabs stay visible while scrolling */
.topbar{position:sticky;top:0;z-index:35;margin:-18px calc(-1 * var(--gutter)) 14px;padding:12px var(--gutter) 0;background:color-mix(in srgb,var(--page) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--grid)}
.topbar header{position:static;margin:0;padding:0;background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.topbar .tabs{margin:8px 0 0;border-bottom:0}
[data-nav], [data-sec], .lay, #plan-body h2, #plan-body h3, #plan-body section { scroll-margin-top: 120px; }

/* plan map focus, trains, replay and clip: moved to static/cards/plan-progress.css */
#stale-badge{font:700 11px var(--mono);color:var(--warning-ink);border:1px solid color-mix(in srgb,var(--warning) 55%,transparent);background:var(--warning-soft);border-radius:var(--r-pill);padding:2px 9px;margin-left:2px;white-space:nowrap}
#err-banner{margin:10px 0;padding:10px 14px;border:1px solid var(--critical);border-radius:8px;background:var(--surface-2);color:var(--critical);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<div class="topbar">
<header class="shell">
<h1 id="title">Agent dashboard</h1>
<span class="live"><span class="dot" id="live-dot"></span><span id="live-txt">connecting</span><span id="stale-badge" hidden>stale</span></span>
<nav class="view-toggle" aria-label="View">
<button type="button" id="view-plan" aria-pressed="false">Plan</button>
<button type="button" id="view-exec" aria-pressed="true">Execution</button>
</nav>
<nav class="view-nav" id="view-nav" aria-label="Views"></nav>
<button type="button" id="nav-sections" aria-expanded="false" aria-controls="sidenav" aria-keyshortcuts="[" title="Section list">Sections</button>
<span class="sp"></span>
<button id="theme" title="Toggle light or dark">Theme</button>
</header>
<nav class="tabs" id="tabs" role="tablist" aria-label="Workstreams"></nav>
</div>
<div id="exec-view">
<div id="err-banner" role="alert" hidden></div>
<main id="main"></main>
<p class="foot" id="foot"></p>
</div>
<div id="plan-view" class="plan-view" hidden>
<main class="plan-main" id="plan-body"></main>
</div>
</div>
<div class="tip" id="tip"></div>
<aside class="drawer" id="drawer" aria-label="Run details"></aside>
<script src="/static/format.js"></script>
<script src="/static/tokencache.js"></script>
<script src="/static/tabs.js"></script>
<script src="/static/models.js"></script>
<script src="/static/core/el.js"></script>
<script src="/static/core/state.js"></script>
<script src="/static/core/api.js"></script>
<script src="/static/core/cache.js"></script>
<script src="/static/core/charts.js"></script>
<script src="/static/core/drawer.js"></script>
<script src="/static/core/project.js"></script>
<script src="/static/vendor/mermaid.min.js"></script>
<script src="/static/plan.js"></script>
<script src="/static/cards/tiles.js"></script>
<script src="/static/cards/token-chart.js"></script>
<script src="/static/cards/live-chart.js"></script>
<script src="/static/cards/timeline.js"></script>
<script src="/static/cards/tables.js"></script>
<script src="/static/cards/ws-cards.js"></script>
<script src="/static/cards/plan-progress.js"></script>
<script src="/static/cards/needs.js"></script>
<script src="/static/cards/planned.js"></script>
<script src="/static/cards/project-home.js"></script>
<script src="/static/cards/archive.js"></script>
<script src="/static/cards/feed.js"></script>
<script src="/static/cards/decisions.js"></script>
<script src="/static/cards/depgraph.js"></script>
<script src="/static/cards/roadmap.js"></script>
<script src="/static/cards/burnup.js"></script>
<script src="/static/cards/registry.js"></script>
<script>
(function () {
  "use strict";



  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { drawer.classList.remove("open"); if (window.__adReplayOn && window.__adReplayExit) window.__adReplayExit(false); } });

  setInterval(function () { if ((state.view === "exec" || isProjectView()) && !window.__adReplayOn) { drawMain(); } }, 60000);
  var resizeT = null;
  window.addEventListener("resize", function () { clearTimeout(resizeT); resizeT = setTimeout(function () { if (window.__adReplayOn) return; if (state.view === "exec" || isProjectView()) drawMain(); else if (window.__adPlanDraw) window.__adPlanDraw(); }, 150); });

  /* Project-view specs, one per view; the card files own the sections. */
  function projectSpecs(snap) {
    if (state.view === "project") return projectHomeSpecs(state, snap);
    if (state.view === "planned") return plannedSpecs(state, snap);
    return archiveSpecs(state, snap);
  }

  function drawMain() {
    renderErrBanner();
    var m = document.getElementById("main");
    var snap = state.snap || {running: [], recent: [], totals: {tokens: {}}};
    var scope = state.view + "|" + state.ws + "|24|" + (window.innerWidth >> 5);
    if (m.dataset.scope !== scope || !m.querySelector("[data-sec]")) { m.innerHTML = ""; secCache = {}; m.dataset.scope = scope; m.classList.remove("fresh"); void m.offsetWidth; m.classList.add("fresh"); }
    if (isProjectView()) {
      applySections(m, projectSpecs(snap));
      return;
    }
    /* Cards run in registry order (static/cards/registry.js): program,
       tiles, running, cards, plan, tokens, conc, gantt, finished. The
       running/tiles specs key on state.snapError so a failed scope reads
       "request failed" instead of zeros; the finished spec subtitles its
       table with finishedSub(snap) ("Newest N of M"). */
    var forOverview = state.ws === "all";
    var specs = [];
    AdPage.cardRegistry.slice().sort(function (a, b) { return a.order - b.order; }).forEach(function (card) {
      if (forOverview ? (card.scope !== "overview" && card.scope !== "both") : (card.scope !== "workstream" && card.scope !== "both")) return;
      var sp = card.spec(state, snap);
      if (sp) specs.push(sp);
    });
    if (state.ws === "all" && state.wss.length && !Object.keys(planSum).length) loadPlanSums().then(function () { delete secCache.program; drawMain(); });
    /* Clip mode shows only the plan progress map; the replay adds the run
       timeline card under it, plus caption and counter strips. */
    if (isClipMode()) {
      document.body.classList.add("clip");
      if (isClipVertical()) document.body.classList.add("clip-v");
      specs = specs.filter(function (sp) { return sp[0] === "plan"; });
    }
    applySections(m, specs);
  }

  setTimeout(warmTabs, 1500);
  setInterval(warmTabs, 45000);
  setInterval(function () { if (!state.wss.length) return; loadPlanSums().then(function () { if ((state.view === "exec" && state.ws === "all") || isProjectView()) drawMain(); }); }, 30000);


  document.getElementById("theme").addEventListener("click", function () {
    var r = document.documentElement, cur = r.getAttribute("data-theme"), dark = cur ? cur === "dark" : true;
    var next = dark ? "light" : "dark";
    r.setAttribute("data-theme", next);
    try { localStorage.setItem("agent-dash-theme", next); } catch (e) {}
    if ((state.view === "exec" || isProjectView()) && state.snap) drawMain();
    else if (window.PlanView) PlanView.restyle();
  });
  document.getElementById("view-plan").addEventListener("click", function () { selectView("plan"); });
  document.getElementById("view-exec").addEventListener("click", function () { selectView("exec"); });
  window.addEventListener("popstate", function () {
    var next = readRoute();
    state.view = next.view;
    state.ws = next.ws;
    showCurrent();
  });

  window.DashCache = {snap: {}, bundle: {}};
  window.DashNav = {openExec: function (ws) { state.ws = canonWs(ws); state.view = "exec"; pushRoute(); showCurrent(); }, openPlan: openPlan};
  var start = readRoute();
  state.view = start.view;
  state.ws = start.ws;
  if (window.PlanView) PlanView.configure({fixtures: FIX, taskmapGet: function () { return TASKMAP; }});
  applyChrome();
  renderTabs();
  loadTaskmap().then(loadNav).then(function () { showCurrent(); });
  stream();
  setInterval(function () {
    loadTaskmap().then(function () {
      if (state.view === "exec") refreshAll();
      else if (isProjectView()) refreshProject();
      else { loadNav(); if (window.PlanView) PlanView.refresh(); }
    });
  }, 30000);
  /* F-core: names the staying page script shares with static/core/*.js.
     Each core file attaches its side to window.AdPage and keeps the same
     plain global, so the card functions below keep calling every name
     unchanged.
     F-cards: the card functions moved verbatim to static/cards/*.js (one
     file per card, listed in static/cards/registry.js). Each card file
     attaches its side to window.AdPage.cards and keeps the same plain
     globals, so the registry specs and the wiring below keep calling
     every name unchanged. */
  window.drawMain = drawMain;
  window.progressFor = progressFor;
  window.statusEl = statusEl;
})();

</script>
<script src="/static/sidenav.js"></script>
</body>
</html>
