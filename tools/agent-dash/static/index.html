<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent execution</title>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/plan.css">
<script>
try {
  var q = new URLSearchParams(location.search);
  var theme = q.get("theme") || localStorage.getItem("agent-dash-theme");
  if (theme === "dark" || theme === "light") document.documentElement.setAttribute("data-theme", theme);
} catch (e) {}
</script>
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 var(--font)}
.wrap{max-width:1400px;margin:0 auto;padding:18px 20px 40px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:20px;margin:0;font-weight:650}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.sp{flex:1}
button,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--ring);border-radius:6px;padding:5px 10px;cursor:pointer}
.tabs{display:flex;gap:2px;margin:14px 0 16px;border-bottom:1px solid var(--grid);overflow-x:auto}
.tab{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 12px;color:var(--ink-2);font-weight:600;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--s1)}
.tab .c{font:500 11px var(--mono);color:var(--muted);margin-left:6px}
.grid{display:grid;gap:14px}
.g-tiles{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr))}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:10px;padding:14px 16px;min-width:0}
.card h2{font-size:13.5px;margin:0 0 2px;font-weight:650}
.card .sub{font-size:12.5px;color:var(--ink-2);margin:0 0 10px}
.tile .v{font-size:28px;font-weight:650;line-height:1.1}
.tile .l{font-size:12.5px;color:var(--ink-2)}
.tile .x{font:12px var(--mono);color:var(--muted);margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2);margin:0 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
svg{display:block;overflow:visible}
.ax text,.ax{fill:var(--muted);font:11px var(--font)}
.gl{stroke:var(--grid);stroke-width:1}
.bl{stroke:var(--axis);stroke-width:1}
.plinks{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0 10px}
.plinks b{font:600 11.5px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-right:4px}
.plinks a{font:600 13px var(--font);color:var(--ink);text-decoration:none;padding:5px 11px;border-radius:999px;border:1px solid var(--grid);background:var(--surface)}
.plinks a:hover,.plinks a:focus-visible{border-color:var(--s1);color:var(--s1)}
.plinks a.cur{border-color:var(--s1);box-shadow:inset 0 0 0 1px var(--s1)}
.planbtn{margin-left:auto;font:600 13px var(--font);color:var(--s1);text-decoration:none;border:1px solid var(--s1);border-radius:999px;padding:4px 11px;white-space:nowrap}
.axt{fill:var(--ink-2);font:600 11px var(--font)}
.tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--ring);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:20;min-width:140px;display:none}
.tip b{display:block;margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
.tip .r i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--grid);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:middle}
td.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--surface-2)}
.tier{display:inline-flex;align-items:center;gap:6px;font:600 11.5px var(--mono)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%}
.st.running i{background:var(--s1);animation:pulse 1.4s infinite}
.st.done i{background:var(--good)}.st.killed i,.st.died_early i{background:var(--critical)}.st.unknown i{background:var(--muted)}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.st.running i{animation:none}}
.vd{font:600 11px var(--mono);padding:2px 6px;border-radius:4px;background:var(--surface-2);color:var(--ink-2)}
.grow{color:var(--good-ink);font-size:11px;margin-left:4px}
.lbl{font-family:var(--mono);font-size:12.5px}
.ws{font:600 11.5px var(--mono);color:var(--ink-2)}
.meter{display:grid;grid-template-columns:70px minmax(0,1fr) 54px;gap:10px;align-items:center;margin:7px 0;font-size:12.5px}
.meter .trk{position:relative;height:14px;background:var(--surface-2);border-radius:3px}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.meter .cap{position:absolute;top:-3px;bottom:-3px;border-left:2px dashed var(--ink)}
.meter .n{text-align:right;font:12px var(--mono)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--grid);font-size:13px}
.alert .ic{font:700 11px var(--mono);padding:2px 6px;border-radius:4px;color:#fff;flex:0 0 auto}
.alert .ic.died_early,.alert .ic.killed{background:var(--critical)}.alert .ic.long_running{background:var(--serious)}.alert .ic.over_cap{background:var(--warning);color:#0b0b0b}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.wsc{cursor:pointer}.wsc:hover{border-color:var(--s1)}
.wsc .top{display:flex;justify-content:space-between;align-items:baseline}
.wsc .id{font:700 15px var(--mono)}
.wsc .bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-2);margin:8px 0 4px;gap:2px}
.wsc .bar span{display:block;height:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--ring);box-shadow:-8px 0 30px rgba(0,0,0,.15);padding:18px;transform:translateX(105%);transition:transform .18s;z-index:30;overflow:auto}
.drawer.open{transform:none}
.seg-ctl{display:inline-flex;border:1px solid var(--ring);border-radius:6px;overflow:hidden}
.seg-ctl button{border:0;border-radius:0;padding:4px 10px;font-size:12px}
.seg-ctl button[aria-pressed="true"]{background:var(--surface-2);font-weight:650}
/* plan DAG */
.dag-scroll{overflow-x:auto;border:1px solid var(--ring);border-radius:10px;background:var(--surface-2)}
.dag{position:relative;min-width:1000px;display:grid;grid-template-columns:repeat(5,1fr);gap:30px;padding:14px}
.dcol{display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.dcolh{font-size:12px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
.dnode{background:var(--surface);border:1.5px solid var(--ring);border-radius:10px;padding:8px 10px}
.dnode.s-done{border-color:var(--good)}.dnode.s-prog{border-color:var(--s5)}.dnode.s-live{border-color:var(--s1);box-shadow:0 0 0 2px color-mix(in srgb,var(--s1) 25%,transparent)}
.dnode h4{margin:0 0 2px;font-size:13px}
.dnode .m{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.dnode .mini{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--grid);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:11px var(--mono);padding:2px 6px;border-radius:5px;border:1.5px solid var(--grid);color:var(--muted);border-style:dashed;display:inline-flex;align-items:center;gap:3px}
.chip::before{font-size:10px;line-height:1}
.chip.done{border-style:solid;border-color:var(--good);color:var(--good-ink);background:color-mix(in srgb,var(--good) 14%,transparent)}
.chip.done::before{content:"\2713"}
.chip.pr{border-style:solid;border-color:var(--warning);color:var(--ink);background:color-mix(in srgb,var(--warning) 22%,transparent)}
.chip.pr::before{content:"\29D7"}
.chip.prog{border-style:solid;border-color:var(--s5);color:var(--ink);background:color-mix(in srgb,var(--s5) 20%,transparent)}
.chip.prog::before{content:"\21E1"}
.chip.deferred{border-style:dotted;opacity:.6}
.chip.deferred::before{content:"\21B7"}
.chip.live{border-style:solid;border-color:var(--s1);background:var(--s1);color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--s1) 30%,transparent);animation:pulse 1.6s infinite}
.chip.live::before{content:"\25CF"}
.chip .ag{display:inline-block;min-width:14px;height:14px;line-height:14px;text-align:center;border-radius:7px;font:700 10px var(--mono);color:#fff;margin-left:2px;padding:0 3px;box-shadow:0 0 0 1.5px #fff}
.chip.just{outline:2.5px solid var(--good);outline-offset:1px}
.dnode .live-n{font:600 11.5px var(--mono);color:var(--s1);margin-bottom:4px}
.unassigned{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.unassigned span{font:12px var(--mono);border:1.5px solid var(--ring);border-radius:5px;padding:2px 6px}
.plegend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:0 0 10px;font-size:12px;color:var(--ink-2)}
.plegend .chip{pointer-events:none}
@media (prefers-reduced-motion:reduce){.chip.live{animation:none}}
.dedges{position:absolute;inset:0;pointer-events:none;z-index:0}
.dedges path{fill:none;stroke:var(--muted);stroke-width:1.4;opacity:.6}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:12px}
.phase{border-left:3px solid var(--s1);padding:2px 0 2px 10px;font-size:12.5px}
.phase b{display:block;font-size:13px}
.phase small{color:var(--muted)}
.foot{margin-top:22px;font-size:12px;color:var(--muted)}
[hidden]{display:none !important}
.view-toggle{display:inline-flex;border:1px solid var(--ring);border-radius:6px;overflow:hidden}
.view-toggle button{border:0;border-radius:0;background:transparent;color:var(--ink-2);font-weight:600;padding:6px 12px}
.view-toggle button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}
.needs-you{margin-bottom:14px}
.needs-line{margin:4px 0;font-size:13px;color:var(--ink-2)}
.needs-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--grid);font-size:13.5px}
.needs-row a{color:var(--ink);font-weight:650;text-decoration:none}
.needs-row a:hover,.needs-row a:focus-visible{color:var(--s1)}
.ap-badge{display:inline-block;font:600 11px var(--mono);padding:2px 7px;border-radius:999px;border:1px solid var(--grid);white-space:nowrap}
.ap-badge.oneway{color:var(--critical);border-color:var(--critical);background:color-mix(in srgb,var(--critical) 12%,transparent)}
.ap-badge.rev{color:var(--good-ink);border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.ap-group{margin-top:12px}
.ap-group h3{font-size:13px;margin:0 0 4px}
.ap-row{display:grid;grid-template-columns:minmax(0,1.4fr) auto minmax(0,1fr);gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--grid);font-size:14px}
.ap-cond{color:var(--ink-2);font-size:13px}
.ap-step{min-width:0}
@media (max-width:640px){.ap-row{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<header class="shell">
<h1 id="title">Agent execution</h1>
<span class="live"><span class="dot" id="live-dot"></span><span id="live-txt">connecting</span></span>
<nav class="view-toggle" aria-label="View">
<button type="button" id="view-plan" aria-pressed="false">Plan</button>
<button type="button" id="view-exec" aria-pressed="true">Execution</button>
</nav>
<span class="sp"></span>
<span class="seg-ctl" id="range"><button data-h="6" aria-pressed="false">6 h</button><button data-h="24" aria-pressed="true">24 h</button><button data-h="72" aria-pressed="false">3 d</button></span>
<button id="theme" title="Toggle light or dark">Theme</button>
</header>
<nav class="tabs" id="tabs" role="tablist" aria-label="Workstreams"></nav>
<div id="exec-view">
<main id="main"></main>
<p class="foot" id="foot"></p>
</div>
<div id="plan-view" class="plan-view" hidden>
<main class="plan-main" id="plan-body"></main>
</div>
</div>
<div class="tip" id="tip"></div>
<aside class="drawer" id="drawer" aria-label="Run details"></aside>
<script src="/static/format.js"></script>
<script src="/static/vendor/mermaid.min.js"></script>
<script src="/static/plan.js"></script>
<script>
(function () {
  "use strict";
  var Q = new URLSearchParams(location.search);
  var FIX = Q.has("fixtures");
  var execCache = {};
  var execGen = 0;
  var state = {view: "exec", ws: "all", hours: 24, snap: null, runs: [], usage: [], conc: [], wss: [], bundles: [], plan: null, seq: -1, groupBy: "model", approvals: []};
  var SERIES = {opus: "--s1", haiku: "--s2", sonnet: "--s3", grok: "--s4", muse: "--s5", glm: "--s6", fable: "--s7", other: "--other"};
  var MODELS = [["opus", "Opus"], ["fable", "Fable"], ["sonnet", "Sonnet"], ["haiku", "Haiku"], ["grok", "Grok 4.7"], ["muse", "muse"], ["glm", "GLM"], ["other", "Other"]];
  function modelName(k) { for (var i = 0; i < MODELS.length; i++) if (MODELS[i][0] === k) return MODELS[i][1]; return k; }
  var WSCOL = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--s7"];
  var wsColor = {};
  function wsNum(w) { var m = /(\d+)/.exec(w.ws || ""); return m ? +m[1] : 999; }
  function shown(list) { return list.filter(function (w) { return w.plan; }).sort(function (x, y) { return wsNum(x) - wsNum(y); }); }
  function cssv(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function tierKey(r) { var t = (r.tier || r.model || "").toLowerCase(); for (var k in SERIES) if (t.indexOf(k) >= 0) return k; return "other"; }
  function modelKey(m) { m = (m || "").toLowerCase(); for (var k in SERIES) if (m.indexOf(k) >= 0) return k; return "other"; }
  function colorOf(key, kind) {
    if (kind === "workstream") { if (!key || key === "null") return "var(--other)"; if (!wsColor[key]) wsColor[key] = WSCOL[Object.keys(wsColor).length % WSCOL.length]; return "var(" + wsColor[key] + ")"; }
    return "var(" + (SERIES[key] || "--other") + ")";
  }
  /* axes() and the compact formatters live in format.js and are shared with the plan view. */
  var fmtDate = AD.fmtDate, fmtN = AD.fmtN, fmtUsd = AD.fmtUsd, fmtDur = AD.fmtDur, fmtT = AD.fmtT, axes = AD.axes, timeTicks = AD.timeTicks;
  function el(tag, attrs, kids) { var e = document.createElement(tag); if (attrs) for (var k in attrs) { if (k === "text") e.textContent = attrs[k]; else if (k === "html") e.innerHTML = attrs[k]; else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), attrs[k]); else e.setAttribute(k, attrs[k]); } (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); }); return e; }
  var NS = "http://www.w3.org/2000/svg";
  function s(tag, attrs) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }

  var FIXMAP = {"/api/snapshot": "snapshot", "/api/runs": "runs", "/api/usage": "usage-model-hour", "/api/concurrency": "concurrency", "/api/sessions": "sessions", "/api/workstreams": "workstreams", "/api/health": "health"};
  function api(path, params) {
    var qs = new URLSearchParams(params || {}).toString();
    if (FIX) {
      if (path === "/api/approvals") {
        return fetch("../fixtures/approvals.json").then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (j) {
          var wanted = params && params.ws;
          if (wanted && wanted !== "all") {
            var hit = (j.approvals || []).filter(function (row) { return row.ws === wanted; })[0];
            return hit || {ws: wanted, decided_at: null, decided_by: null, items: []};
          }
          return j;
        });
      }
      var base = FIXMAP[path] || path.replace("/api/", "");
      if (path === "/api/usage" && params && params.group === "workstream") base = "usage-workstream-hour";
      if (path === "/api/plan") base = "plan-" + params.ws;
      if (path === "/api/snapshot" && params && params.ws && params.ws !== "all") base = "snapshot-" + params.ws;
      return fetch("../fixtures/" + base + ".json").then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
    }
    return fetch(path + (qs ? "?" + qs : "")).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }

  /* tooltip */
  var tip = document.getElementById("tip");
  function showTip(ev, title, rows) {
    tip.innerHTML = ""; tip.appendChild(el("b", {text: title}));
    rows.forEach(function (r) { var d = el("div", {class: "r"}); var a = el("span"); if (r.c) { var i = el("i"); i.style.background = r.c; a.appendChild(i); } a.appendChild(document.createTextNode(r.k)); d.appendChild(a); d.appendChild(el("span", {text: r.v})); tip.appendChild(d); });
    tip.style.display = "block";
    var x = ev.clientX + 14, y = ev.clientY + 14, w = tip.offsetWidth, h = tip.offsetHeight;
    if (x + w > innerWidth - 8) x = ev.clientX - w - 14; if (y + h > innerHeight - 8) y = ev.clientY - h - 14;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  function hideTip() { tip.style.display = "none"; }

  function canonWs(ws) {
    if (!ws || String(ws).toLowerCase() === "all" || String(ws).toLowerCase() === "overview") return "all";
    if (/^ws\d+$/i.test(ws)) return String(ws).toUpperCase();
    return String(ws);
  }
  function readRoute() {
    var q = new URLSearchParams(location.search);
    var view = q.get("view");
    var path = location.pathname;
    if (view !== "plan" && view !== "exec") view = (path === "/plan" || /plan\.html$/.test(path)) ? "plan" : "exec";
    return {view: view, ws: canonWs(q.get("ws") || "")};
  }
  function planIdFor(ws) {
    if (ws && ws !== "all") return ws;
    var program = null;
    (state.bundles || []).forEach(function (b) { if (!program && (b.kind === "program" || b.id === "OVERVIEW")) program = b; });
    if (program) return program.id;
    return (state.bundles && state.bundles.length) ? state.bundles[0].id : "OVERVIEW";
  }
  function queryWs() {
    if (state.view === "plan") return planIdFor(state.ws);
    return state.ws === "all" ? "all" : state.ws;
  }
  function pushRoute(hash) {
    var u = new URL(location.href);
    var path = location.pathname;
    if (path === "/plan" || /\/plan\.html$/.test(path)) u.pathname = /plan\.html$/.test(path) ? path.replace(/plan\.html$/, "index.html") : "/";
    u.searchParams.set("view", state.view);
    u.searchParams.set("ws", queryWs());
    if (FIX) u.searchParams.set("fixtures", "");
    u.hash = hash || "";
    var next = u.pathname + u.search + u.hash;
    if (next === location.pathname + location.search + location.hash) return;
    history.pushState({view: state.view, ws: state.ws}, "", u);
  }
  function applyChrome() {
    var plan = state.view === "plan";
    document.getElementById("exec-view").hidden = plan;
    document.getElementById("plan-view").hidden = !plan;
    document.getElementById("view-plan").setAttribute("aria-pressed", plan ? "true" : "false");
    document.getElementById("view-exec").setAttribute("aria-pressed", plan ? "false" : "true");
    document.getElementById("range").hidden = plan;
    document.getElementById("title").textContent = plan ? "Plan" : "Agent execution";
    document.title = plan ? "Plan" : "Agent execution";
  }
  function scrollHash() {
    if (!location.hash) return;
    var node = document.querySelector(location.hash);
    if (node && node.scrollIntoView) node.scrollIntoView();
  }
  function showCurrent() {
    applyChrome();
    renderTabs();
    if (state.view === "exec") {
      var hit = execCache[state.ws];
      if (hit) {
        state.snap = hit.snap; state.runs = hit.runs; state.usage = hit.usage; state.conc = hit.conc; state.plan = hit.plan; state.seq = hit.seq; state.approvals = hit.approvals || [];
        drawMain();
      }
      refreshAll();
      return;
    }
    var id = planIdFor(state.ws);
    var job = window.PlanView ? PlanView.show(id) : null;
    if (job && job.then) job.then(function (ok) { setLive(ok !== false); scrollHash(); });
  }
  function selectTab(ws) {
    ws = canonWs(ws);
    if (ws === state.ws) return;
    state.ws = ws;
    pushRoute();
    showCurrent();
  }
  function selectView(view) {
    if (state.view === view) return;
    state.view = view;
    pushRoute();
    showCurrent();
  }
